<div style="padding: 40px; background-color: #f5f5f5; min-height: 100vh;">
  <h1 style="text-align: center; margin-bottom: 40px; color: #333; font-size: 32px;">User Directory</h1>

  <div
    style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; max-width: 1400px; margin: 0 auto;">
    @for(user of userList; track user.id) {
    <div
      style="background: white; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); overflow: hidden; transition: all 0.3s ease;">

      <div
        style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 30px; text-align: center; color: white;">
        <div style="font-size: 50px; margin-bottom: 10px;">👤</div>
        <h3 style="margin: 0; font-size: 20px; font-weight: 600;">{{ user.name }}</h3>
      </div>

      <div style="padding: 24px;">
        <p style="margin: 12px 0; color: #555; font-size: 14px;">
          <strong style="color: #333;">Email:</strong> {{ user.email }}
        </p>
        <p style="margin: 12px 0; color: #555; font-size: 14px;">
          <strong style="color: #333;">Role:</strong> {{ user.role }}
        </p>
        <p style="margin: 12px 0; color: #555; font-size: 14px;">
          <strong style="color: #333;">Age:</strong> {{ user.age }}
        </p>
        <p style="margin: 12px 0; color: #555; font-size: 14px;">
          <strong style="color: #333;">City:</strong> {{ user.city }}
        </p>

        <button
          style="width: 100%; padding: 12px; margin-top: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; transition: opacity 0.3s ease;"
          (click)="viewUserProfile(user.id)">
          View Profile
        </button>
      </div>
    </div>
    }
  </div>
</div>
<router-outlet></router-outlet>
