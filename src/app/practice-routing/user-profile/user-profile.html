<div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 40px 20px;">
    <div style="max-width: 900px; margin: 0 auto;">
        <!-- Back Button -->
        <button (click)="goBack()"
            style="background: rgba(255,255,255,0.2); color: white; border: 2px solid white; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-bottom: 30px; transition: all 0.3s ease;">
            ← Back to Home
        </button>

        <!-- Profile Card -->
        @if (user){
        <div style="background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.2);">

            <!-- Header Section -->
            <div
                style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 50px 40px; text-align: center; color: white;">
                <div style="font-size: 80px; margin-bottom: 20px;">👤</div>
                <h1 style="margin: 0; font-size: 36px; font-weight: 700;">{{ user.name }}</h1>
                <p style="margin: 10px 0 0 0; font-size: 18px; opacity: 0.95;">{{ user.role }}</p>
            </div>

            <!-- Content Section -->
            <div style="padding: 50px 40px;">
                <!-- Info Grid -->
                <div
                    style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; margin-bottom: 40px;">

                    <!-- Email Card -->
                    <div
                        style="background: #f8f9ff; padding: 25px; border-radius: 10px; border-left: 5px solid #667eea;">
                        <p
                            style="margin: 0 0 10px 0; color: #667eea; font-weight: 600; font-size: 12px; text-transform: uppercase;">
                            Email Address</p>
                        <p style="margin: 0; color: #333; font-size: 16px; word-break: break-all;">{{ user.email }}</p>
                    </div>

                    <!-- Age Card -->
                    <div
                        style="background: #f8f9ff; padding: 25px; border-radius: 10px; border-left: 5px solid #667eea;">
                        <p
                            style="margin: 0 0 10px 0; color: #667eea; font-weight: 600; font-size: 12px; text-transform: uppercase;">
                            Age</p>
                        <p style="margin: 0; color: #333; font-size: 16px; font-weight: 600;">{{ user.age }} years old
                        </p>
                    </div>

                    <!-- City Card -->
                    <div
                        style="background: #f8f9ff; padding: 25px; border-radius: 10px; border-left: 5px solid #667eea;">
                        <p
                            style="margin: 0 0 10px 0; color: #667eea; font-weight: 600; font-size: 12px; text-transform: uppercase;">
                            Location</p>
                        <p style="margin: 0; color: #333; font-size: 16px; font-weight: 600;">{{ user.city }}, India</p>
                    </div>

                    <!-- Role Card -->
                    <div
                        style="background: #f8f9ff; padding: 25px; border-radius: 10px; border-left: 5px solid #764ba2;">
                        <p
                            style="margin: 0 0 10px 0; color: #764ba2; font-weight: 600; font-size: 12px; text-transform: uppercase;">
                            Professional Role</p>
                        <p style="margin: 0; color: #333; font-size: 16px; font-weight: 600;">{{ user.role }}</p>
                    </div>

                    <!-- ID Card -->
                    <div
                        style="background: #f8f9ff; padding: 25px; border-radius: 10px; border-left: 5px solid #764ba2;">
                        <p
                            style="margin: 0 0 10px 0; color: #764ba2; font-weight: 600; font-size: 12px; text-transform: uppercase;">
                            User ID</p>
                        <p style="margin: 0; color: #333; font-size: 16px; font-weight: 600;">#{{ user.id }}</p>
                    </div>

                    <!-- Member Since Card -->
                    <div
                        style="background: #f8f9ff; padding: 25px; border-radius: 10px; border-left: 5px solid #764ba2;">
                        <p
                            style="margin: 0 0 10px 0; color: #764ba2; font-weight: 600; font-size: 12px; text-transform: uppercase;">
                            Member Since</p>
                        <p style="margin: 0; color: #333; font-size: 16px; font-weight: 600;">January 2024</p>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div
                    style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; padding-top: 30px; border-top: 2px solid #f0f0f0;">
                    <button
                        style="padding: 12px 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 15px; transition: all 0.3s ease;">
                        Send Message
                    </button>
                    <button
                        style="padding: 12px 30px; background: transparent; color: #667eea; border: 2px solid #667eea; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 15px; transition: all 0.3s ease;">
                        Connect
                    </button>
                    <button (click)="goBack()"
                        style="padding: 12px 30px; background: transparent; color: #999; border: 2px solid #ddd; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 15px; transition: all 0.3s ease;">
                        Back to List
                    </button>
                </div>
            </div>
        </div>
        }
    </div>
</div>
