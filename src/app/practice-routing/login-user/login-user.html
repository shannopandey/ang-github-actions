<div class="login-container">
  <h2>Login</h2>
  <form #loginForm="ngForm" (ngSubmit)="onLogin(loginForm)">
    <div class="form-group">
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" [(ngModel)]="username" required #usernameModel="ngModel">
      <div *ngIf="usernameModel.invalid && usernameModel.touched" class="error">Username is required.</div>
    </div>
    <div class="form-group">
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" [(ngModel)]="password" required minlength="8" #passwordModel="ngModel">
      <div *ngIf="passwordModel.invalid && passwordModel.touched" class="error">
        <div *ngIf="passwordModel.errors?.['required']">Password is required.</div>
        <div *ngIf="passwordModel.errors?.['minlength']">Password must be at least 8 characters long.</div>
      </div>
    </div>
    <button type="submit" [disabled]="loginForm.invalid" (click)="source = 'user'">Login as User</button>
    <button type="submit" [disabled]="loginForm.invalid" (click)="source = 'admin'">Login as Admin</button>
  </form>
</div>
